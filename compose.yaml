services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: live_data
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d live_data"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/live_data
      FIXTURE_PATH: /app/tests/fixtures/xhs_notes.json
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:

